<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Suivi VE Cloud</title><link rel="manifest" href="manifest.json">
<style>
body{font-family:system-ui,Arial;margin:0;background:#f8fafc;color:#0f172a}.wrap{max-width:1150px;margin:auto;padding:16px}
header{background:linear-gradient(135deg,#064e3b,#0f766e,#16a34a);color:white;border-radius:24px;padding:20px}
.card{background:white;border:1px solid #e2e8f0;border-radius:20px;padding:16px;margin-top:14px;box-shadow:0 8px 25px #0001}
.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}@media(max-width:800px){.g2,.g3,.g4{grid-template-columns:1fr}}
input,select{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:12px;font-size:16px}label{font-weight:800;color:#64748b;font-size:13px;display:block;margin:8px 0 5px}
button{border:0;border-radius:14px;padding:12px 14px;font-weight:900;margin:4px;cursor:pointer}.p{background:#0f766e;color:white}.s{background:#f1f5f9}.d{background:#fee2e2;color:#991b1b}
.tabs{display:flex;gap:8px;overflow:auto;position:sticky;top:0;background:#f8fafcee;padding:12px 0}.tab{background:white;border:1px solid #e2e8f0}.tab.active{background:#0f766e;color:white}
.hide{display:none}.muted{color:#64748b}.ok{background:#f0fdf4;border:1px solid #bbf7d0;color:#166534;border-radius:16px;padding:12px}.warn{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;border-radius:16px;padding:12px}
.stat{background:white;border:1px solid #e2e8f0;border-radius:18px;padding:14px}.stat b{font-size:24px}table{border-collapse:collapse;width:100%;min-width:800px}td,th{border-bottom:1px solid #e2e8f0;padding:9px;text-align:left}.scroll{overflow:auto}.code{font-size:28px;font-weight:950;letter-spacing:.12em;background:#f1f5f9;border-radius:14px;padding:12px;display:inline-block}
</style>
</head>
<body><div class="wrap">
<header><h1>Suivi VE Cloud</h1><p>V14 Firebase — comptes séparés, voiture partagée, sauvegarde cloud.</p></header>

<section id="authPage" class="card">
<h2>Connexion</h2><div class="grid g2"><div><label>Email</label><input id="email" type="email"></div><div><label>Mot de passe</label><input id="password" type="password"></div></div>
<button class="p" onclick="signIn()">Se connecter</button><button class="s" onclick="signUp()">Créer mon compte</button><div id="authMsg"></div>
</section>

<section id="appPage" class="hide">
<nav class="tabs"><button class="tab active" data-tab="home">Accueil</button><button class="tab" data-tab="vehicle">Voiture</button><button class="tab" data-tab="morning">Matin</button><button class="tab" data-tab="memo">Mémo soir</button><button class="tab" data-tab="stats">Stats</button><button class="tab" data-tab="history">Historique</button><button class="tab" data-tab="settings">Paramètres</button></nav>

<div id="home" class="page"><div class="card"><button class="d" onclick="logout()">Déconnexion</button><p id="userInfo"></p><p id="vehicleInfo"></p></div><div id="homeStats" class="grid g4"></div></div>

<div id="vehicle" class="page hide">
<div class="grid g2"><div class="card"><h2>Créer une voiture</h2><label>Nom</label><input id="vehicleName" placeholder="Kia e-Niro"><button class="p" onclick="createVehicle()">Créer</button></div>
<div class="card"><h2>Rejoindre</h2><label>Code invitation</label><input id="inviteCodeInput"><button class="p" onclick="joinVehicle()">Rejoindre</button></div></div>
<div class="card"><h2>Code à partager</h2><div id="inviteBox" class="warn">Crée ou rejoins une voiture.</div></div>
</div>

<div id="morning" class="page hide"><div class="card"><h2>☀️ Relevé du matin</h2><div id="memoMorningCard" class="ok">Aucun mémo.</div>
<div class="grid g3"><div><label>Date</label><input id="date" type="date"></div><div><label>% du soir</label><input id="before" type="number" oninput="previewCharge()"></div><div><label>% du matin</label><input id="after" type="number" oninput="previewCharge()"></div><div><label>Autonomie</label><input id="range" type="number"></div><div><label>Température</label><input id="temp" type="number"></div><div><label>Kilométrage</label><input id="odo" type="number"></div></div>
<div id="preview" class="warn" style="margin-top:10px">Entre les valeurs.</div><button class="p" onclick="saveMorning()">Enregistrer</button></div></div>

<div id="memo" class="page hide"><div class="card"><h2>🌙 Mémo du soir</h2><div class="grid g2"><div><label>Date</label><input id="memoDate" type="date"></div><div><label>% arrivée</label><input id="memoPercent" type="number"></div></div><button class="p" onclick="saveMemo()">Enregistrer</button></div></div>

<div id="stats" class="page hide"><div id="statsCards" class="grid g4"></div><div class="card"><h2>Coût par mois</h2><div class="scroll"><table id="monthTable"></table></div></div><div class="card"><h2>Comparatif</h2><div id="compareBox"></div></div></div>
<div id="history" class="page hide"><div class="card"><h2>Relevés</h2><div class="scroll"><table id="readingsTable"></table></div></div><div class="card"><h2>Recharges</h2><div class="scroll"><table id="chargesTable"></table></div></div></div>
<div id="settings" class="page hide"><div class="card"><h2>Paramètres</h2><div class="grid g3"><div><label>Batterie kWh</label><input id="sBattery" type="number" step=".1"></div><div><label>Prix HC</label><input id="sHC" type="number" step=".001"></div><div><label>Prix HP</label><input id="sHP" type="number" step=".001"></div><div><label>Conso VE %/100 km</label><input id="sEvPct" type="number" step=".1"></div><div><label>Prix carburant €/L</label><input id="sFuelPrice" type="number" step=".01"></div><div><label>Conso thermique L/100</label><input id="sFuelCons" type="number" step=".1"></div></div><button class="p" onclick="saveSettings()">Sauvegarder</button></div></div>
</section></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import { getFirestore, doc, collection, addDoc, setDoc, getDocs, updateDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyCnJx5sgNLIzXhDNA-Qjvdh5aG-pSQQnLs",
  authDomain: "suivi-voiture-electrique.firebaseapp.com",
  projectId: "suivi-voiture-electrique",
  storageBucket: "suivi-voiture-electrique.firebasestorage.app",
  messagingSenderId: "459839740842",
  appId: "1:459839740842:web:9edb0a504ec53d578ea9d3",
  measurementId: "G-L18ZWMT02B"
};
const app=initializeApp(firebaseConfig), auth=getAuth(app), db=getFirestore(app);
const DEF={batteryKwh:64,hcPrice:.16,hpPrice:.21,evPctPer100km:20,fuelPrice:1.80,fuelCons:6};
let user=null, vehicleId=localStorage.getItem("vehicleId"), vehicle=null, readings=[], charges=[], memo=null, unsubs=[];
window.signUp=async()=>{try{await createUserWithEmailAndPassword(auth,email.value,password.value)}catch(e){authMsg.innerHTML='<div class="warn">'+e.message+'</div>'}}
window.signIn=async()=>{try{await signInWithEmailAndPassword(auth,email.value,password.value)}catch(e){authMsg.innerHTML='<div class="warn">'+e.message+'</div>'}}
window.logout=async()=>{localStorage.removeItem("vehicleId");await signOut(auth)}
onAuthStateChanged(auth,u=>{user=u;if(!u){authPage.classList.remove("hide");appPage.classList.add("hide");return}authPage.classList.add("hide");appPage.classList.remove("hide");setToday();if(vehicleId)sub(vehicleId);render()});
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");document.querySelectorAll(".page").forEach(p=>p.classList.add("hide"));document.getElementById(b.dataset.tab).classList.remove("hide");render()});
function setToday(){let d=new Date().toISOString().slice(0,10);date.value=d;memoDate.value=d} function n(v){return Number(v)||0} function pct(v){return Math.round(n(v)*10)/10} function euro(v){return n(v).toLocaleString("fr-FR",{style:"currency",currency:"EUR"})} function fr(d){return d?new Date(d+"T12:00:00").toLocaleDateString("fr-FR"):"—"} function s(){return vehicle?.settings||DEF} function cde(){return Math.random().toString(36).slice(2,8).toUpperCase()}
window.createVehicle=async()=>{let ref=await addDoc(collection(db,"vehicles"),{name:vehicleName.value||"Voiture électrique",inviteCode:cde(),members:{[user.uid]:true},createdBy:user.email,settings:DEF,createdAt:serverTimestamp()});vehicleId=ref.id;localStorage.setItem("vehicleId",vehicleId);sub(vehicleId)}
window.joinVehicle=async()=>{let snap=await getDocs(collection(db,"vehicles")), found=null, code=inviteCodeInput.value.trim().toUpperCase();snap.forEach(d=>{if((d.data().inviteCode||"").toUpperCase()===code)found=d});if(!found){inviteBox.innerHTML="Code introuvable";return}await updateDoc(doc(db,"vehicles",found.id),{["members."+user.uid]:true});vehicleId=found.id;localStorage.setItem("vehicleId",vehicleId);sub(vehicleId)}
function sub(id){unsubs.forEach(u=>u&&u());unsubs=[];unsubs.push(onSnapshot(doc(db,"vehicles",id),x=>{vehicle=x.exists()?{id:x.id,...x.data()}:null;render()}));unsubs.push(onSnapshot(query(collection(db,"vehicles",id,"readings"),orderBy("date","asc")),x=>{readings=x.docs.map(d=>({id:d.id,...d.data()}));render()}));unsubs.push(onSnapshot(query(collection(db,"vehicles",id,"charges"),orderBy("date","asc")),x=>{charges=x.docs.map(d=>({id:d.id,...d.data()}));render()}));unsubs.push(onSnapshot(doc(db,"vehicles",id,"shared","memo"),x=>{memo=x.exists()?x.data():null;render()}));}
function calc(b,a){let add=Math.max(0,n(a)-n(b)), kwh=s().batteryKwh*add/100, cost=kwh*s().hcPrice;return{add,kwh,cost}}
window.previewCharge=()=>{if(!before.value||!after.value){preview.innerHTML="Entre les deux pourcentages.";return null}let r=calc(before.value,after.value);preview.innerHTML=`Recharge : ${before.value}% → ${after.value}% = +${pct(r.add)}% — ${pct(r.kwh)} kWh — <b>${euro(r.cost)}</b>`;return r}
window.saveMorning=async()=>{if(!vehicleId){alert("Crée ou rejoins une voiture.");return}if(!before.value||!after.value||!range.value||!temp.value||!odo.value){alert("Remplis les champs.");return}let r=calc(before.value,after.value);await addDoc(collection(db,"vehicles",vehicleId,"readings"),{date:date.value,charge:n(after.value),range:n(range.value),temp:n(temp.value),odo:n(odo.value),createdBy:user.email,createdAt:serverTimestamp()});if(r.add>0)await addDoc(collection(db,"vehicles",vehicleId,"charges"),{date:date.value,before:n(before.value),after:n(after.value),addedPct:r.add,kwh:r.kwh,cost:r.cost,createdBy:user.email,createdAt:serverTimestamp()});await setDoc(doc(db,"vehicles",vehicleId,"shared","memo"),{percent:null,date:null});before.value=after.value=range.value=temp.value=odo.value=""}
window.saveMemo=async()=>{if(!vehicleId){alert("Crée ou rejoins une voiture.");return}await setDoc(doc(db,"vehicles",vehicleId,"shared","memo"),{date:memoDate.value,percent:n(memoPercent.value),createdBy:user.email,createdAt:serverTimestamp()});memoPercent.value=""}
window.saveSettings=async()=>{await updateDoc(doc(db,"vehicles",vehicleId),{settings:{batteryKwh:n(sBattery.value),hcPrice:n(sHC.value),hpPrice:n(sHP.value),evPctPer100km:n(sEvPct.value),fuelPrice:n(sFuelPrice.value),fuelCons:n(sFuelCons.value)}});alert("Sauvegardé")}
function intervals(){let r=[...readings].filter(x=>x.odo).sort((a,b)=>a.date.localeCompare(b.date)), out=[];for(let i=1;i<r.length;i++){let km=n(r[i].odo)-n(r[i-1].odo);if(km>0)out.push({km,date:r[i].date,fuel:km*s().fuelCons/100*s().fuelPrice,ev:km*(s().batteryKwh*s().evPctPer100km/100)/100*s().hcPrice})}return out}
function stat(k,v){return '<div class="stat"><span class="muted">'+k+'</span><br><b>'+v+'</b></div>'} function mkey(d){return d?d.slice(0,7):""}
function render(){if(!user)return;userInfo.innerText=user.email;if(!vehicle){vehicleInfo.innerText="Aucune voiture.";inviteBox.innerHTML="Crée ou rejoins une voiture.";return}vehicleInfo.innerText="Voiture : "+vehicle.name;inviteBox.innerHTML='<div class="code">'+vehicle.inviteCode+'</div>';if(memo?.percent){memoMorningCard.innerHTML=`Mémo : <b>${memo.percent}%</b> le ${fr(memo.date)} par ${memo.createdBy||"—"}`;if(!before.value)before.value=memo.percent}else memoMorningCard.innerHTML="Aucun mémo.";
let total=charges.reduce((a,c)=>a+n(c.cost),0), kwh=charges.reduce((a,c)=>a+n(c.kwh),0), ints=intervals(), km=ints.reduce((a,x)=>a+x.km,0), fuel=ints.reduce((a,x)=>a+x.fuel,0), ev=ints.reduce((a,x)=>a+x.ev,0);
homeStats.innerHTML=[stat("Coût électrique",euro(total)),stat("kWh",pct(kwh)),stat("Km calculés",km+" km"),stat("Recharges",charges.length)].join("");
statsCards.innerHTML=[stat("Électrique réel",euro(total)),stat("Élec estimée oubli",euro(ev)),stat("Essence estimée",euro(fuel)),stat("Économie",euro(fuel-total))].join("");
compareBox.innerHTML='<p class="muted">Essence : km × '+s().fuelCons+' L/100 × '+s().fuelPrice+' €/L. Élec oubli : '+s().evPctPer100km+'%/100 km.</p>';
let by={};charges.forEach(c=>{let k=mkey(c.date);by[k]??={count:0,kwh:0,cost:0};by[k].count++;by[k].kwh+=n(c.kwh);by[k].cost+=n(c.cost)});monthTable.innerHTML='<tr><th>Mois</th><th>Recharges</th><th>kWh</th><th>Coût</th></tr>'+Object.keys(by).sort().reverse().map(k=>`<tr><td>${k}</td><td>${by[k].count}</td><td>${pct(by[k].kwh)}</td><td>${euro(by[k].cost)}</td></tr>`).join("");
readingsTable.innerHTML='<tr><th>Date</th><th>%</th><th>Autonomie</th><th>Temp</th><th>Km</th><th>Par</th></tr>'+[...readings].reverse().map(r=>`<tr><td>${fr(r.date)}</td><td>${r.charge}%</td><td>${r.range}</td><td>${r.temp}°C</td><td>${r.odo}</td><td>${r.createdBy||"—"}</td></tr>`).join("");
chargesTable.innerHTML='<tr><th>Date</th><th>Avant</th><th>Après</th><th>kWh</th><th>Coût</th><th>Par</th></tr>'+[...charges].reverse().map(c=>`<tr><td>${fr(c.date)}</td><td>${c.before}%</td><td>${c.after}%</td><td>${pct(c.kwh)}</td><td>${euro(c.cost)}</td><td>${c.createdBy||"—"}</td></tr>`).join("");
sBattery.value=s().batteryKwh;sHC.value=s().hcPrice;sHP.value=s().hpPrice;sEvPct.value=s().evPctPer100km;sFuelPrice.value=s().fuelPrice;sFuelCons.value=s().fuelCons;}
if("serviceWorker"in navigator)navigator.serviceWorker.register("./service-worker.js").catch(()=>{});
</script></body></html>
